    (function () {

         do vesklab.com, do laranja ao azul, correndo devagar. */
      const K = window.VeskKit, seg = K.segmento("marca"), dur = seg.quadros / K.FPS;
      const barra = window.VESK.cartela_marca.barra;
      const b = document.getElementById("mc-barra");
      Object.assign(b.style, { left: barra.x + "px", top: barra.y + "px", width: barra.largura + "px",
        height: barra.altura + "px" });
      // O wordmark assenta logo acima da barra: a linha de base fica 22 px acima dela.
      const nome = document.getElementById("mc-nome");
      nome.style.top = (barra.y - 22 - 240 * 0.86) + "px";
      const tl = gsap.timeline({ paused: true });
      const campo = new K.Campo(document.getElementById("mc-campo"), { passo: 24, semente: 3 });
      const ruido = K.ruido(9);
      function desenhar(t) {
        campo.desenhar((p) => {
          const meio = 1560 + 120 * Math.sin(p.x / 260 + t * 0.6) - 0.18 * (p.x - 540);

        }, "#000");
      }

      window.__timelines["marca"] = tl;
