<template>
  <style>
    #root { position: absolute; inset: 0; background: #000; overflow: hidden; }
    #h2v-fundo { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #h2v-a { left: 90px; top: 369px; }
    #h2v-b { left: 590px; top: 369px; }
    .h2v-rotulo { position: absolute; top: 300px; margin: 0; }
    #h2v-contorno { position: absolute; left: 716px; top: 526px; width: 148px; height: 324px;
      border: 6px solid var(--grifo); border-radius: 8px; box-sizing: border-box; }
    #h2v-etiqueta { position: absolute; left: 716px; top: 478px; margin: 0; padding: 4px 12px;
      font-family: var(--mono); font-weight: 500; font-size: 28px; letter-spacing: 0.1em; text-transform: uppercase;
      background: var(--grifo); color: #0b0b10; border-radius: 6px; white-space: nowrap; }
  </style>
  <div id="root" data-composition-id="h2-variante" data-width="1080" data-height="1920">
    <canvas id="h2v-fundo" width="1080" height="1920" data-layout-allow-overflow></canvas>
    <p class="h2v-rotulo vk-rotulo" style="left:90px">Control</p>
    <p id="h2v-rotulo-b" class="h2v-rotulo vk-rotulo" style="left:590px">Variant</p>
    <div id="h2v-a"></div>
    <div id="h2v-b"></div>
    <div id="h2v-contorno"></div>
    <p id="h2v-etiqueta">One change</p>
  </div>
  <script>
    (function () {
      /* A variante: o anúncio e a cópia dele lado a lado, iguais, os dois no cartão do feed, com os nomes do teste A/B
         (controle e variante). Em «one», uma coisa só muda na cópia: o frasco entra já na abertura, contornado no
         grifo. É o teste do site (o produto primeiro), com uma troca só. */
      const K = window.VeskKit, seg = K.segmento("variante"), dur = seg.quadros / K.FPS;
      const em = (w) => K.q(K.palavra(seg, w).inicio);
      const tl = gsap.timeline({ paused: true });
      const a = new K.Anuncio(document.getElementById("h2v-a"), { largura: 400, altura: 711, colunas: 36 });
      const b = new K.Anuncio(document.getElementById("h2v-b"), { largura: 400, altura: 711, colunas: 36 });
      const fundo = new K.Campo(document.getElementById("h2v-fundo"), { passo: 24, semente: 37 });
      const cor = K.aura([
        { x: 60, y: 1660, rx: 640, ry: 420, u: 0.85 },
        { x: 1080, y: 1500, rx: 520, ry: 380, u: 0.2 },
        { x: 1040, y: 180, rx: 420, ry: 260, u: 0.45, forca: 0.7 },
      ], { semente: 43, apaga: [K.LEGENDA.concat(0.8)] });
      const troca = em("one");
      function desenhar(t) {
        const f = (t / dur) * 0.6;
        const andamento = 0.1 + 0.25 * (t / dur);
        a.desenhar("abertura", f, andamento);
        b.desenhar(t < troca ? "abertura" : "frasco", f, andamento);
        fundo.desenhar((p) => cor(p, t), "#000");
      }
      K.relogio(tl, dur, desenhar);
      tl.fromTo("#h2v-rotulo-b", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, em("variant"));
      tl.fromTo("#h2v-contorno", { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" },
        troca);
      tl.fromTo("#h2v-etiqueta", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.15, ease: "expo.out" }, troca);
      window.__timelines["h2-variante"] = tl;
    })();
  </script>
</template>
